
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>🛍️ ShopEasy</h2>
    <input type="text" id="search"
           placeholder="Search products..."
           oninput="showProducts()">
    <button onclick="toggleCart()">
      🛒 Cart (<span id="count">0</span>)
    </button>
  </header>

  <nav>
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Electronics')">Electronics</button>
    <button onclick="filterCategory('Fashion')">Fashion</button>
    <button onclick="filterCategory('Accessories')">Accessories</button>
  </nav>

  <section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Discover amazing products at great prices!</p>
    <a href="#products">Shop Now</a>
  </section>

  <h2 class="heading">Featured Products</h2>
  <section class="products" id="products"></section>

  <aside class="cart" id="cart">
    <button class="close" onclick="toggleCart()">✕</button>
    <h2>Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button class="checkout" onclick="checkout()">Checkout</button>
  </aside>

  <footer>
    <p>© 2026 ShopEasy | E-Commerce Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
